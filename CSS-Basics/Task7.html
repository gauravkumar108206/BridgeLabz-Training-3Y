<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Us</title>

    <style>


        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }


        body {
            font-family: Arial, sans-serif;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background-color: #e0f2fe;

            color: #1e293b;

            padding: 20px;
        }


        .contact-container {

            width: 100%;

            max-width: 600px;

            background-color: #ffffff;

            padding: 40px;

            border-radius: 15px;

            box-shadow:
                0 8px 25px rgba(0, 0, 0, 0.12);
        }


        .contact-container h1 {

            text-align: center;

            font-size: 2.5rem;

            color: #0c4a6e;

            margin-bottom: 10px;
        }


        .contact-container p {

            text-align: center;

            color: #64748b;

            margin-bottom: 30px;
        }


        form {

            width: 100%;
        }


        .form-group {

            margin-bottom: 20px;
        }

        label {

            display: block;

            font-size: 1rem;

            font-weight: bold;

            color: #334155;

            margin-bottom: 8px;
        }


        input,
        textarea {

            width: 100%;

            padding: 13px 15px;

            font-size: 1rem;

            font-family: Arial, sans-serif;

            color: #1e293b;

            background-color: #f8fafc;

            border: 2px solid #cbd5e1;

            border-radius: 8px;

            box-shadow:
                0 2px 6px rgba(0, 0, 0, 0.06);

            outline: none;

            transition:
                border-color 0.3s ease,
                box-shadow 0.3s ease;
        }

        input:focus,
        textarea:focus {

            border-color: #0284c7;

            background-color: #ffffff;

            box-shadow:
                0 0 0 3px rgba(2, 132, 199, 0.15);
        }


        textarea {

            min-height: 150px;

            resize: vertical;
        }

        button {

            width: 100%;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background-color: #0284c7;

            color: white;

            font-size: 1.1rem;

            font-weight: bold;

            cursor: pointer;

            transition:
                background-color 0.3s ease,
                transform 0.2s ease;
        }


        button:hover {

            background-color: #0369a1;

            transform: translateY(-2px);
        }



    </style>

</head>


<body>


    <div class="contact-container">


        <h1>Contact Us</h1>

        <p>
            Have a question? Fill out the form below and
            we'll get back to you.
        </p>


        <form action="#" method="post">



            <div class="form-group">

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >

            </div>


            <div class="form-group">

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter subject"
                    required
                >

            </div>


            <div class="form-group">

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    placeholder="Write your message here..."
                    required
                ></textarea>

            </div>


            <button type="submit">
                Send Message
            </button>


        </form>

    </div>


</body>

</html>
